global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # SafeBrowser Frontend
  - job_name: 'safebrowser-frontend'
    static_configs:
      - targets: ['frontend:3000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # AI Model Server (if enabled)
  - job_name: 'ai-model-server'
    static_configs:
      - targets: ['ai-model-server:80']
    scrape_interval: 30s
    scrape_timeout: 10s

  # Qdrant Vector Database (if enabled)
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
    metrics_path: '/metrics'
    scrape_interval: 30s
